<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Home Pod</title>
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Home Pod">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="theme-color" content="#f8fafd">
<link rel="apple-touch-icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 180 180'%3E%3Crect width='180' height='180' rx='40' fill='%23e8f0fe'/%3E%3Cpath d='M90 30l17.6 38.4 41.9 4.7-31.2 28.4 8.6 41.3L90 121.8l-36.9 21 8.6-41.3-31.2-28.4 41.9-4.7z' fill='%23fbbc04' stroke='%23e37400' stroke-width='4' stroke-linejoin='round'/%3E%3C/svg%3E">
<style>
  html, body { margin: 0; height: 100%; background: #f8fafd; overflow: hidden; }
  iframe { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; }
  #help { font: 18px/1.5 -apple-system, system-ui, sans-serif; color: #1f1f1f; max-width: 34em; margin: 15vh auto; padding: 0 24px; }
</style>
</head>
<body>
<!--
  Home Pod fridge page. It shows the fridge link full-page, so that when it is
  added to the iPad's Home Screen it opens with no browser bars and no full-screen X.
  The secret fridge code is NOT stored in this file: it is taken from the part of
  this page's address after #, e.g.  https://<this page>/#k=<fridge code>
-->
<div id="help" hidden>
  <h2>Home Pod</h2>
  <p>This page needs the fridge code. Open it as <b>this address#k=</b> followed by the code from Home Pod, Settings &gt; Fridge link (the part after <b>k=</b>).</p>
</div>
<script>
(function () {
  var APP = 'https://script.google.com/macros/s/AKfycbxLIcolYVC17rtqw4O9eF1bsnvqzpUeDZhxXRBETiNvzfnDQCCVsIcqYuNl_E99hgipIw/exec';
  var m = /[#&?]k=([A-Za-z0-9]{16,80})/.exec(location.hash + location.search);
  var key = m ? m[1] : '';
  try { if (key) localStorage.setItem('hpKey', key); else key = localStorage.getItem('hpKey') || ''; } catch (e) {}
  if (!key) { document.getElementById('help').hidden = false; return; }
  var f = document.createElement('iframe');
  f.src = APP + '?k=' + key;
  f.allow = 'fullscreen; autoplay';
  f.title = 'Home Pod';
  document.body.appendChild(f);
})();
</script>
</body>
</html>
